<article class="icon-card{{#if inset}} icon-card--inset{{/if}}" data-reveal>
  <div class="icon-card__head">
    <img
      class="icon-card__image"
      src="{{icon}}"
      width="98"
      height="98"
      alt=""
      aria-hidden="true"
      loading="lazy"
    />
    <h3 class="icon-card__title">{{title}}</h3>
  </div>
  <p class="icon-card__text">{{text}}</p>
</article>
