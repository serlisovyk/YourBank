<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}" />
<meta name="theme-color" content="{{site.themeColor}}" />
<link rel="canonical" href="{{site.url}}{{page.path}}" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta property="og:site_name" content="{{site.name}}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{page.title}}" />
<meta property="og:description" content="{{page.description}}" />
<meta property="og:url" content="{{site.url}}{{page.path}}" />
<meta property="og:image" content="{{site.url}}{{site.image.src}}" />
<meta property="og:image:width" content="{{site.image.width}}" />
<meta property="og:image:height" content="{{site.image.height}}" />
<meta property="og:image:alt" content="{{site.image.alt}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{page.title}}" />
<meta name="twitter:description" content="{{page.description}}" />
<meta name="twitter:image" content="{{site.url}}{{site.image.src}}" />
<link rel="stylesheet" href="/styles/style.css" />
<script type="module" src="/scripts/main.js"></script>
