<footer class="footer" data-footer>
  <div class="container">
    <div class="footer__inner">
      <a href="/" class="footer__logo hit-area">
        <img
          src="/assets/images/logo.svg"
          alt="YourBank"
          class="footer__logo-image"
          width="156"
          height="40"
        />
      </a>

      <nav class="footer__nav" aria-label="Footer navigation">
        <ul class="footer__nav-list">
          {{#each navigation}}
          <li>
            <a
              href="{{href}}"
              class="footer__link"
              aria-current="{{#if (eq key ../page.navKey)}}page{{else}}false{{/if}}"
              >{{label}}</a
            >
          </li>
          {{/each}}
        </ul>
      </nav>

      <address class="footer__contacts">
        <ul class="footer__contact-list">
          {{#each contacts}}
          <li class="footer__contact">
            <img
              src="{{icon}}"
              alt=""
              aria-hidden="true"
              class="footer__contact-icon"
              width="24"
              height="24"
            />
            {{#if href}}
            <a href="{{href}}" class="footer__link">{{text}}</a>
            {{else}}
            <span class="footer__contact-text">{{text}}</span>
            {{/if}}
          </li>
          {{/each}}
        </ul>
      </address>

      <div class="footer__bar">
        <ul class="footer__socials">
          {{#each socials}}
          <li>
            <a
              href="{{href}}"
              class="footer__social"
              aria-label="{{name}} (opens in a new tab)"
              target="_blank"
              rel="noopener"
            >
              <img
                src="{{icon}}"
                alt=""
                aria-hidden="true"
                class="footer__social-icon"
                width="24"
                height="24"
              />
            </a>
          </li>
          {{/each}}
        </ul>

        <p class="footer__copyright">{{footer.copyright}}</p>

        <ul class="footer__legal">
          {{#each footer.legalDocuments}}
          <li class="footer__legal-item">{{this}}</li>
          {{/each}}
        </ul>
      </div>

      <div class="footer__credits">
        <p class="footer__author">
          {{footer.authorName}}<span data-footer-year></span>
        </p>

        <a
          href="{{footer.sourceCode.href}}"
          class="footer__source"
          aria-label="{{footer.sourceCode.label}}"
          title="{{footer.sourceCode.label}}"
          target="_blank"
          rel="noopener"
        >
          <svg
            class="footer__source-icon"
            viewBox="0 0 16 16"
            width="24"
            height="24"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
