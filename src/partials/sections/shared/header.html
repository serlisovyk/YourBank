<header class="header" data-header>
  <a class="button header__skip-link" href="#main">Skip to content</a>
  <div class="container">
    <div class="header__inner">
      <a href="/" class="header__logo hit-area">
        <img
          src="/assets/images/logo.svg"
          alt="YourBank"
          class="header__logo-image"
          width="156"
          height="40"
        />
      </a>

      <nav
        class="header__nav"
        id="header-navigation"
        aria-label="Main navigation"
        data-header-nav
      >
        <ul class="header__nav-list">
          {{#each navigation}}
          <li class="header__nav-item">
            <a
              href="{{href}}"
              class="header__nav-link hit-area"
              aria-current="{{#if (eq key ../page.navKey)}}page{{else}}false{{/if}}"
              >{{label}}</a
            >
          </li>
          {{/each}}
        </ul>
      </nav>

      <button
        id="header-menu-toggle"
        data-header-menu-toggle
        type="button"
        class="header__menu-toggle hit-area"
        aria-label="Open menu"
        aria-controls="header-navigation"
        aria-expanded="false"
      >
        <span class="header__menu-line" aria-hidden="true"></span>
        <span class="header__menu-line" aria-hidden="true"></span>
        <span class="header__menu-line" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
