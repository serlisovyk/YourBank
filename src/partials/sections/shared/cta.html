<section class="cta section">
  <div class="container">
    <div class="cta__inner" data-reveal>
      <div class="cta__content">
        <h2 class="cta__title">
          {{#if titleStart}}{{titleStart}} {{/if}}<span>{{titleAccent}}</span>{{#if
          titleEnd}} {{titleEnd}}{{/if}}
        </h2>
        <p class="cta__text">{{text}}</p>
      </div>
      <a class="cta__button button button--large" href="{{button.href}}"
        >{{button.label}}</a
      >
    </div>
  </div>
</section>
